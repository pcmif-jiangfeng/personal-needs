[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-needs"
version = "0.1.0"
description = "A local-first tool for discovering recurring personal needs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
personal-needs = "app.server:main"

[tool.setuptools]
packages = ["app"]
